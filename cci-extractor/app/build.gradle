plugins { id 'com.android.application' }
android {
    namespace 'com.retrotools.cciextractor'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.retrotools.cciextractor'
        minSdk 26
        targetSdk 34
        versionCode 16
        versionName '0.14.0'
        // Native CIA decryption engine (ctrtool + makerom). ARM devices only.
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=Release'
                cppFlags '-std=c++17'
                cFlags '-std=c11'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file('../native/CMakeLists.txt')
            version '4.1.2'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
