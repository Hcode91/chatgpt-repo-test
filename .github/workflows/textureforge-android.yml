name: Build TextureForge Android APK
on:
  push:
    branches: [textureforge-android]
    paths:
      - 'TextureForge/**'
      - '.github/workflows/textureforge-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore source archive
        shell: bash
        run: |
          mkdir -p TextureForge/build-source
          base64 --decode TextureForge/project.tar.xz.b64 > /tmp/textureforge.tar.xz
          tar -xJf /tmp/textureforge.tar.xz -C TextureForge/build-source
          test -f TextureForge/build-source/app/build.gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests
        working-directory: TextureForge/build-source
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build APK
        working-directory: TextureForge/build-source
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TextureForge-Android-debug-apk
          path: TextureForge/build-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
