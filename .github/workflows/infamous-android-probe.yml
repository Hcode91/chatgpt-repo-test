name: inFAMOUS Android ARM64 probe APK
on:
  workflow_dispatch:
  push:
    branches:
      - experimental/infamous-arm64-probe
      - feature/infamous-eu-game-boot
    paths:
      - 'android-port-lab/**'
      - '.github/workflows/infamous-android-probe.yml'
permissions:
  contents: read
jobs:
  android-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform + NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Checkout official game port source (no proprietary game files)
        run: git clone --depth 1 https://github.com/whompay/inFAMOUSreborn.git android-port-lab/upstream
      - name: Fetch SDL2 headers for Android input and audio compatibility
        run: |
          mkdir -p android-port-lab/third_party
          git clone --depth 1 --branch release-2.30.12 \
            https://github.com/libsdl-org/SDL.git android-port-lab/third_party/SDL2-src
          ln -s SDL2-src/include android-port-lab/third_party/SDL2
      - name: Checkout ARM64 libucontext for Android cellFiber
        run: |
          git clone --depth 1 https://github.com/kaniini/libucontext.git android-port-lab/third_party/libucontext
          git -C android-port-lab/third_party/libucontext fetch --depth 1 origin 49e671dd52ff6791295d8161ad3b6da7dc5f6f9d
          git -C android-port-lab/third_party/libucontext checkout --detach 49e671dd52ff6791295d8161ad3b6da7dc5f6f9d
      - name: Apply Android compatibility fixes to upstream runtime clone
        run: python3 android-port-lab/tools/patch_android_upstream.py android-port-lab/upstream/ps3recomp
      - name: Generate clean-room PPC64 test ELF
        run: python3 android-port-lab/tools/generate_ppu_smoke.py --out android-port-lab/generated
      - name: Bundle the clean-room ELF with the Android application
        run: |
          mkdir -p android-port-lab/app/src/main/assets
          cp android-port-lab/generated/smoke.elf android-port-lab/app/src/main/assets/smoke.elf
      - name: Lift real PowerPC instruction bytes using upstream ps3recomp
        run: |
          python3 android-port-lab/upstream/ps3recomp/tools/ppu_lifter.py \
            android-port-lab/generated/smoke.elf \
            --output android-port-lab/generated \
            --functions android-port-lab/generated/functions.json \
            --jobs 1 --single-file
      - name: Compile and execute lifted PPU smoke on Linux
        run: |
          c++ -std=c++20 -O0 -DPPU_SMOKE_HOST \
            -I android-port-lab/generated \
            -I "$JAVA_HOME/include" -I "$JAVA_HOME/include/linux" \
            -x c++ android-port-lab/generated/ppu_recomp.c \
            android-port-lab/app/src/main/cpp/ppu_smoke.cpp \
            -o /tmp/ppu-smoke
          /tmp/ppu-smoke
      - name: Compile and execute ELF loading smoke on Linux
        run: |
          c++ -std=c++20 -O0 -DPPU_ELF_HOST \
            -I android-port-lab/generated \
            -I "$JAVA_HOME/include" -I "$JAVA_HOME/include/linux" \
            -x c++ android-port-lab/generated/ppu_recomp.c \
            android-port-lab/app/src/main/cpp/ppu_smoke.cpp \
            android-port-lab/app/src/main/cpp/elf_boot.cpp \
            -o /tmp/ppu-elf-smoke
          /tmp/ppu-elf-smoke android-port-lab/generated/smoke.elf
          /tmp/ppu-elf-smoke android-port-lab/generated/smoke.elf --reject-mutated
      - name: Verify direct European PPU engine without bundling the game
        run: |
          # Synthetic ELF only: real EU ELF remains entirely on user's phone.
          c++ -std=c++17 -O2 -Wall -Wextra -DREAL_PPU_PROBE_HOST \
            android-port-lab/app/src/main/cpp/real_ppu_probe.cpp \
            -o /tmp/infamous-eu-ppu-engine
          /tmp/infamous-eu-ppu-engine android-port-lab/generated/smoke.elf \
            | tee /tmp/infamous-eu-engine.log
          grep -q "REAL PS3 EBOOT STARTUP TRACE" /tmp/infamous-eu-engine.log
          /tmp/infamous-eu-ppu-engine --test-time-hle | tee /tmp/eu-time-hle.log
          grep -q "TIME_HLE_REGRESSION_PASS" /tmp/eu-time-hle.log
          /tmp/infamous-eu-ppu-engine --test-lv2-time | tee /tmp/eu-lv2-time.log
          grep -q "LV2_TIME_SERVICES_PASS" /tmp/eu-lv2-time.log
          /tmp/infamous-eu-ppu-engine --test-division | tee /tmp/eu-division.log
          grep -q "PPC_DIVISION_REGRESSION_PASS" /tmp/eu-division.log
          ! grep -q "Status: GAME BOOT SUCCESS" /tmp/infamous-eu-engine.log
      - name: Cross-compile upstream PPU, LV2, SPU, RSX, input and audio for Android ARM64
        run: |
          python3 android-port-lab/tools/audit_runtime_android.py \
            --ndk "$ANDROID_HOME/ndk/27.2.12479018" \
            --out android-port-lab/build/audit
      - name: Verify game-data admission fails closed without BCES00220 files
        run: |
          if python3 android-port-lab/tools/check_infamous_dump.py               android-port-lab/generated/smoke.elf; then
            echo "ERROR: synthetic demo was wrongly accepted as inFAMOUS"; exit 1
          fi
      - name: Upload Android runtime compatibility audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infamous-android-runtime-audit
          path: |
            android-port-lab/build/audit/audit.md
            android-port-lab/build/audit/audit.json
          if-no-files-found: warn
      - name: Link upstream full Android runtime and PPU boot scaffold
        id: integrated-runtime
        continue-on-error: true
        run: bash android-port-lab/tools/build_android_runtime.sh
      - name: Validate private game boot target with synthetic lift ONLY
        run: |
          # Public CI must never receive real EBOOT.elf or generated title code.
          # Reuse the existing synthetic PPU lift to verify the optional target.
          test -f android-port-lab/generated/ppu_recomp.h
          test -f android-port-lab/generated/ppu_recomp.c
          ! test -e android-port-lab/app/src/main/jniLibs/arm64-v8a/libps3eu.so
          cmake -S android-port-lab/runtime-integration \
            -B android-port-lab/build/integrated \
            -DINFAMOUS_PRIVATE_RECOMP="$PWD/android-port-lab/generated"
          cmake --build android-port-lab/build/integrated \
            --target infamous_eu_private_boot --parallel 3
          test -s android-port-lab/build/integrated/libps3eu.so
          readelf -h android-port-lab/build/integrated/libps3eu.so | grep -q AArch64
          echo "PRIVATE_GAME_TARGET_LINK_CHECK=PASS (SYNTHETIC ONLY)"
          # Never package this synthetic alternate as the user's real game.
          ! test -e android-port-lab/app/src/main/jniLibs/arm64-v8a/libps3eu.so
      - name: Package actual upstream Android ARM64 boot executable and test ELF
        run: |
          set -e
          BIN="android-port-lab/build/integrated/ps3recomp/ps3recomp_boot_smoke"
          ELF="android-port-lab/build/integrated/ps3recomp/smoke/smoke.elf"
          test -s "$BIN"
          test -s "$ELF"
          readelf -h "$BIN" | grep -q 'AArch64'
          mkdir -p android-port-lab/app/src/main/jniLibs/arm64-v8a
          cp "$BIN" android-port-lab/app/src/main/jniLibs/arm64-v8a/libps3boot.so
          # The actual NDK boot executable needs libc++_shared.so at runtime.
          CXX_SO="$(find "$ANDROID_HOME/ndk/27.2.12479018" -type f -name libc++_shared.so | grep -E '/(aarch64-linux-android|arm64-v8a)/' | head -n 1)"
          test -n "$CXX_SO"
          test -s "$CXX_SO"
          cp "$CXX_SO" android-port-lab/app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          cp "$ELF" android-port-lab/app/src/main/assets/upstream-smoke.elf
          echo "PACKAGED_REAL_UPSTREAM_BOOT_EXECUTABLE=yes"
      - name: Upload full runtime build report and compiler errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infamous-android-full-runtime-integration
          path: android-port-lab/build/integrated-logs/
          if-no-files-found: warn
      - name: Build ARM64 APK
        working-directory: android-port-lab
        run: gradle --no-daemon assembleDebug
      - name: Upload Android build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infamous-android-arm64-probe
          path: android-port-lab/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
