name: Export all published IPSW decryption keys

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download public key archive
        run: git clone --depth 1 https://github.com/LukeZGD/Legacy-iOS-Kit-Keys.git source-firmware-keys
      - name: Build searchable catalogues and OS version mapping
        run: python tools/export_public_ipsw_keys.py --input source-firmware-keys --output exported_keys --fetch-versions
      - uses: actions/upload-artifact@v4
        with:
          name: IPSW-all-published-keys
          path: IPSW_PUBLIC_KEYS_CATALOGUE.zip
          compression-level: 0
          if-no-files-found: error
