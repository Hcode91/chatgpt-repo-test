name: Build CCI Extractor APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cci-extractor-android

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test BTEX texture codecs (14 standard 3DS formats)
        run: bash cci-extractor/tests/run-texture-smoke-test.sh
      - name: Test 3DS Title ID export folder layout
        run: bash cci-extractor/tests/run-export-path-test.sh
      - name: Test NES tile codec and CHR-RAM safeguards
        run: bash cci-extractor/tests/run-nes-smoke-test.sh
      - name: Test Nintendo DS NitroFS parser
        run: bash cci-extractor/tests/run-nds-smoke-test.sh
      - name: Test Nintendo DS NCGR/NCLR graphics previews
        run: bash cci-extractor/tests/run-nds-graphics-test.sh
      - name: Test SNES, Mega Drive, Game Boy and GBA tile codecs
        run: bash cci-extractor/tests/run-retro-smoke-test.sh
      - name: Test LZ10/LZ11, NARC, DS PNG import, GB/GBA checksums and palettes
        run: bash cci-extractor/tests/run-containers-test.sh
      - name: Test CIA/CCI repackaging and texture conversions
        run: bash cci-extractor/tests/run-converters-test.sh
      - name: Test Torus PAK container, hunk parsing and ETC1 textures
        run: bash cci-extractor/tests/run-torus-pak-test.sh
      - name: Test 3DS/DS archives, textures, audio and tilemaps (SARC, darc, GARC, CTPK, BCLIM, BCSTM, NSBTX, SDAT ...)
        run: bash cci-extractor/tests/run-asset-formats-test.sh
      - name: Test PS1 disc images (ISO 9660 in 2352/2336/2048-byte sectors), TIM and VAG
        run: bash cci-extractor/tests/run-ps1-test.sh
      - name: Test Metal Gear Solid VOX voice archives (PS-ADPCM, stereo, subtitles)
        run: bash cci-extractor/tests/run-mgs-vox-test.sh
      - name: Test native CIA engine on synthetic titles (CIA -> CCI, DLC refusal)
        run: bash cci-extractor/tests/run-native-engine-test.sh
      - name: Install Android SDK 35 components
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          printf 'y\n' | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;4.1.2"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android debug APK
        run: gradle --no-daemon -p cci-extractor :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: game-asset-extractor-v0.12-debug-apk
          path: cci-extractor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
