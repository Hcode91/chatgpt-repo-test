name: Build CCI Extractor APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cci-extractor-android

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test BTEX texture codecs (14 standard 3DS formats)
        run: bash cci-extractor/tests/run-texture-smoke-test.sh
      - name: Test NES tile codec and CHR-RAM safeguards
        run: bash cci-extractor/tests/run-nes-smoke-test.sh
      - name: Install Android SDK 35 components
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          printf 'y\n' | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android debug APK
        run: gradle --no-daemon -p cci-extractor :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: game-asset-extractor-v0.3-debug-apk
          path: cci-extractor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
