name: Build CCI Extractor APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/cci-extractor-android
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Android source
        run: tar -xJf .build/cci-app-src.tar.xz --strip-components=1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cci-extractor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
