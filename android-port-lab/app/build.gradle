plugins {
    id 'com.android.application'
}
android {
    namespace 'com.hcode91.infamousprobe'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.hcode91.infamousprobe'
        minSdk 26
        targetSdk 28
        versionCode 5
        versionName '0.5-upstream-runtime'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -Wall -Wextra' }
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols.add("**/libps3boot.so")
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
