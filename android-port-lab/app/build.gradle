plugins {
    id 'com.android.application'
}
android {
    namespace 'com.hcode91.infamousprobe'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.hcode91.infamousprobe'
        minSdk 26
        targetSdk 28
        versionCode 7
        versionName '0.7-guest-rsx-triangles'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -Wall -Wextra' }
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols.add("**/libps3boot.so")
            // Keep the game runner's .symtab: its crash reporter and hot-spot
            // sampler resolve internal (non-exported) function names from it.
            keepDebugSymbols.add("**/libps3eu.so")
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
