plugins {
    id 'com.android.application'
}
android {
    namespace 'com.hcode91.ps3elfextractor'
    compileSdk 35
    defaultConfig {
        applicationId 'com.hcode91.ps3elfextractor'
        minSdk 26
        targetSdk 28
        versionCode 2
        versionName '0.2-alpha'
        ndk { abiFilters 'arm64-v8a' }
    }
    packaging {
        jniLibs { useLegacyPackaging true }
    }
    buildTypes { release { minifyEnabled false } }
}
