<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT GitHub Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
    main { border: 1px solid #ccc; border-radius: 16px; padding: 1.5rem; }
    button { font: inherit; padding: .7rem 1rem; border-radius: 10px; cursor: pointer; }
    #result { font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>GitHub connection test</h1>
    <p>This tiny page was created to test editing a repository from ChatGPT on a phone.</p>
    <button id="test">Test interaction</button>
    <p id="result" role="status">Waiting for you to tap the button.</p>
  </main>
  <script>
    document.querySelector('#test').addEventListener('click', () => {
      document.querySelector('#result').textContent = 'Success! The page is interactive.';
    });
  </script>
</body>
</html>
